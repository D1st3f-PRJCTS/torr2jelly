<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <link rel="icon" type="image/png" href="/static/logo.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/static/logo.png?v=2">
  <link rel="apple-touch-icon" href="/static/logo.png?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torr2Jelly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/static/i18n.js?v=1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            jelly: '#00a4dc',
            torr: '#10b981'
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white"
      x-data="app()" x-init="init()" x-cloak>

  <!-- ==================== TOAST NOTIFICATIONS ==================== -->
  <div class="fixed top-5 right-5 z-50 flex flex-col space-y-2.5 max-w-sm w-full pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto glass rounded-2xl p-4 shadow-2xl border flex items-start space-x-3 transition-all duration-300 animate-in fade-in slide-in-from-top-2"
           :class="{
             'border-emerald-500/40 bg-slate-900/95 text-emerald-300': toast.type === 'success',
             'border-rose-500/40 bg-slate-900/95 text-rose-300': toast.type === 'error',
             'border-cyan-500/40 bg-slate-900/95 text-cyan-300': toast.type === 'info'
           }">
        <div class="shrink-0 mt-0.5">
          <i class="fa-solid text-base"
             :class="{
               'fa-circle-check text-emerald-400': toast.type === 'success',
               'fa-circle-exclamation text-rose-400': toast.type === 'error',
               'fa-circle-info text-cyan-400': toast.type === 'info'
             }"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-white leading-relaxed" x-text="toast.message"></p>
        </div>
        <button @click="removeToast(toast.id)" class="text-slate-400 hover:text-white shrink-0 p-0.5">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </template>
  </div>

  <!-- Top Navbar -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Logo + Brand -->
      <div class="flex items-center space-x-3 cursor-pointer select-none shrink-0" @click="activeTab = 'search'">
        <img src="/static/logo.png?v=2" alt="Torr2Jelly Logo" class="w-10 h-10 rounded-xl object-contain shadow-lg shadow-brand-500/20 border border-slate-700/50">
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">Torr2Jelly</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30 font-medium">v1.5</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block" x-text="t('app_subtitle')"></p>
        </div>
      </div>

      <template x-if="isLoggedIn">
        <div class="flex items-center space-x-2 sm:space-x-3">
          <!-- Primary Navigation Tabs -->
          <nav class="flex items-center space-x-1 bg-slate-950/70 p-1 rounded-xl border border-slate-800/80 shadow-inner">
            <button @click="activeTab = 'search'"
                    :class="activeTab === 'search' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                    class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
              <i class="fa-solid fa-magnifying-glass text-[11px]"></i>
              <span class="hidden md:inline" x-text="t('tab_search')"></span>
            </button>

            <button @click="activeTab = 'magnet'"
                    :class="activeTab === 'magnet' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                    class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
              <i class="fa-solid fa-magnet text-[11px]"></i>
              <span class="hidden md:inline" x-text="t('tab_magnet')"></span>
            </button>

            <template x-if="isAdmin">
              <button @click="activeTab = 'settings'"
                      :class="activeTab === 'settings' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                      class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
                <i class="fa-solid fa-gear text-[11px]"></i>
                <span class="hidden md:inline" x-text="t('tab_settings')"></span>
              </button>
            </template>
          </nav>

          <!-- Single Smart Sync Button (STRM + Jellyfin refresh) -->
          <button @click="triggerSync()" :disabled="syncing"
                  :title="t('sync_btn_tooltip')"
                  class="flex items-center space-x-2 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 active:scale-95 transition-all text-xs font-semibold shadow-md shadow-brand-600/25 disabled:opacity-50">
            <i class="fa-solid fa-rotate text-xs" :class="syncing ? 'animate-spin' : ''"></i>
            <span class="hidden sm:inline" x-text="syncing ? t('syncing') : t('sync_now')"></span>
          </button>

          <!-- User Menu Dropdown -->
          <div class="relative" @click.outside="userMenuOpen = false">
            <button @click="userMenuOpen = !userMenuOpen"
                    class="flex items-center space-x-2 px-3 py-1.5 rounded-xl glass hover:bg-slate-800 transition-all text-xs border border-slate-700/80">
              <i class="fa-solid" :class="isAdmin ? 'fa-crown text-amber-400' : 'fa-user text-brand-400'"></i>
              <span class="font-semibold text-white max-w-[90px] truncate hidden sm:inline" x-text="currentUser?.username"></span>
              <span class="text-[10px] px-1.5 py-0.2 rounded font-bold hidden sm:inline"
                    :class="isAdmin ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-400'"
                    x-text="isAdmin ? t('role_admin') : t('role_user')"></span>
              <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''"></i>
            </button>

            <!-- Dropdown Menu -->
            <div x-show="userMenuOpen"
                 class="absolute right-0 mt-2 w-52 rounded-xl glass bg-slate-900 border border-slate-700/80 shadow-2xl py-1.5 z-50 text-xs divide-y divide-slate-800">
              <div class="px-3 py-2 text-[11px] text-slate-400">
                <span x-text="t('logged_in_as')"></span>: <span class="font-bold text-white" x-text="currentUser?.username"></span>
              </div>
              <div class="py-1">
                <template x-if="isAdmin">
                  <button @click="activeTab = 'settings'; userMenuOpen = false"
                          class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center space-x-2 text-slate-200">
                    <i class="fa-solid fa-gear text-brand-400 w-4"></i>
                    <span x-text="t('tab_settings')"></span>
                  </button>
                </template>
                <button @click="openChangePasswordModal()"
                        class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center space-x-2 text-slate-200">
                  <i class="fa-solid fa-key text-cyan-400 w-4"></i>
                  <span x-text="t('change_password')"></span>
                </button>
              </div>
              <div class="py-1">
                <button @click="logout()"
                        class="w-full text-left px-3 py-2 hover:bg-rose-500/10 hover:text-rose-400 flex items-center space-x-2 text-slate-300 transition-colors">
                  <i class="fa-solid fa-arrow-right-from-bracket w-4 text-rose-400"></i>
                  <span x-text="t('logout')"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8" x-show="isLoggedIn">

    <!-- TAB 1: Search Media by Title -->
    <div x-show="activeTab === 'search'" class="space-y-6">
      <div class="glass rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="mb-4">
          <h2 class="text-lg font-bold flex items-center space-x-2">
            <i class="fa-solid fa-magnifying-glass text-amber-400"></i>
            <span x-text="t('search_heading')"></span>
          </h2>
          <p class="text-xs text-slate-400 mt-0.5" x-text="t('search_desc')"></p>
        </div>

        <form @submit.prevent="executeSearch()" class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-4 top-3.5 text-sm text-slate-400"></i>
            <input type="text" x-model="searchQueryTitle" required
                   :placeholder="t('search_placeholder')"
                   class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-10 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all">
            <button type="button" x-show="searchQueryTitle" @click="searchQueryTitle = ''; searchResults = []"
                    class="absolute right-3.5 top-3.5 text-slate-400 hover:text-white transition-colors"
                    title="Очистити">
              <i class="fa-solid fa-circle-xmark text-sm"></i>
            </button>
          </div>
          <button type="submit" :disabled="searching || !searchQueryTitle.trim()"
                  class="px-7 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-semibold text-sm shadow-lg shadow-orange-500/25 active:scale-95 transition-all flex items-center justify-center space-x-2 disabled:opacity-50">
            <i class="fa-solid fa-magnifying-glass" :class="searching ? 'animate-spin' : ''"></i>
            <span x-text="searching ? t('searching_btn') : t('search_btn')"></span>
          </button>
        </form>

        <!-- Filters & Sorting bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-3 border-t border-slate-800 text-xs">
          <!-- Status Filter -->
          <div class="flex items-center space-x-4 text-slate-400">
            <template x-if="status.only_gold_torrents && !isAdmin">
              <span class="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold text-[11px] flex items-center space-x-1.5">
                <i class="fa-solid fa-crown text-amber-400 text-[10px]"></i>
                <span x-text="t('gold_only_mode_active')"></span>
              </span>
            </template>
            <template x-if="!status.only_gold_torrents || isAdmin">
              <div class="flex items-center space-x-4">
                <span class="font-medium text-slate-300" x-text="t('filter_label')"></span>
                <button @click="filterStatus = 'all'"
                        :class="filterStatus === 'all' ? 'text-white font-bold underline' : 'hover:text-slate-200'"
                        x-text="t('filter_all')">
                </button>
                <button @click="filterStatus = 'gold'"
                        :class="filterStatus === 'gold' ? 'text-amber-400 font-bold underline' : 'hover:text-amber-300'"
                        class="flex items-center space-x-1">
                  <span x-text="t('filter_gold')"></span>
                  <span class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-400 text-[10px]" x-text="goldCount"></span>
                </button>
              </div>
            </template>
          </div>

          <!-- Category Default Dropdown -->
          <div class="flex items-center space-x-2">
            <span class="text-slate-400 font-medium" x-text="t('search_category_label')"></span>
            <select x-model="searchDefaultCategory"
                    class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer">
              <option value="auto" x-text="t('type_auto')"></option>
              <template x-for="cat in availableCategories" :key="cat.id">
                <option :value="cat.id" x-text="cat.name || cat.id"></option>
              </template>
            </select>
          </div>

          <!-- Sorting Dropdown -->
          <div class="flex items-center space-x-2">
            <span class="text-slate-400 font-medium" x-text="t('sort_label')"></span>
            <select x-model="sortBy"
                    class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer">
              <option value="priority" x-text="t('sort_priority')"></option>
              <option value="seeders_desc" x-text="t('sort_seeders_desc')"></option>
              <option value="size_desc" x-text="t('sort_size_desc')"></option>
              <option value="size_asc" x-text="t('sort_size_asc')"></option>
              <option value="date_desc" x-text="t('sort_date_desc')"></option>
              <option value="title_asc" x-text="t('sort_title_asc')"></option>
            </select>
          </div>
        </div>
      </div>

      <!-- Search Results -->
      <div x-show="searchResults.length > 0" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-300">
            <span x-text="t('results_shown')"></span> <span class="text-amber-400" x-text="filteredSearchResults.length"></span>
          </h3>
          <span class="text-xs text-slate-500" x-text="t('click_hint')"></span>
        </div>

        <div class="glass rounded-xl overflow-hidden border border-slate-800">
          <div class="divide-y divide-slate-800/80">
            <template x-for="r in filteredSearchResults" :key="r.guid || r.link">
              <div class="p-4 hover:bg-slate-800/40 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                   :class="r.release_status === 'gold' ? 'bg-amber-500/[0.03]' : ''">
                <div class="flex-1 min-w-0 space-y-1.5">
                  <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <!-- Gold / Silver Status Badges -->
                    <template x-if="r.release_status === 'gold'">
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-500/20 to-yellow-500/20 text-amber-300 border border-amber-500/40 font-bold flex items-center space-x-1 shadow-sm shadow-amber-500/20">
                        <span x-text="t('badge_gold')"></span>
                      </span>
                    </template>
                    <template x-if="r.release_status === 'silver'">
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-400/20 text-slate-300 border border-slate-400/40 font-bold flex items-center space-x-1">
                        <span x-text="t('badge_silver')"></span>
                      </span>
                    </template>

                    <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold" x-text="r.indexer"></span>
                    <span class="text-xs text-slate-400 font-medium" x-text="formatBytes(r.size)"></span>
                    <span class="text-xs text-emerald-400 font-semibold flex items-center space-x-1">
                      <i class="fa-solid fa-arrow-up text-[10px]"></i>
                      <span x-text="r.seeders + ' ' + t('seeders_unit')"></span>
                    </span>
                    <span class="text-xs text-slate-500 flex items-center space-x-1">
                      <i class="fa-solid fa-arrow-down text-[10px]"></i>
                      <span x-text="r.leechers + ' ' + t('leechers_unit')"></span>
                    </span>
                    <template x-if="r.publish_date">
                      <span class="text-[11px] text-slate-500" x-text="formatDate(r.publish_date)"></span>
                    </template>
                  </div>

                  <!-- Clickable Torrent Link -->
                  <div>
                    <a :href="r.page_url" target="_blank" rel="noopener noreferrer"
                       class="text-sm font-bold text-white hover:text-amber-400 transition-colors inline-flex items-center space-x-1.5 group/link"
                       :title="r.title">
                      <span class="line-clamp-1" x-text="r.title"></span>
                      <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400 group-hover/link:text-amber-400 transition-colors shrink-0"></i>
                    </a>
                  </div>

                  <p class="text-xs text-slate-400">
                    <span x-text="t('jellyfin_name')"></span> <span class="text-slate-200 font-semibold" x-text="r.clean_title"></span>
                  </p>
                </div>

                <div class="flex items-center space-x-2.5 shrink-0">
                  <select x-model="r.category"
                          :title="t('category_label')"
                          class="bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer shadow-sm">
                    <option value="auto" x-text="t('type_auto')"></option>
                    <template x-for="cat in availableCategories" :key="cat.id">
                      <option :value="cat.id" x-text="cat.name || cat.id" :selected="r.category === cat.id"></option>
                    </template>
                  </select>
                  <button @click="addFromSearch(r)" :disabled="addingGuid === r.guid"
                          :class="r.release_status === 'gold' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-bold shadow-amber-500/25' : 'bg-brand-600 hover:bg-brand-500 text-white shadow-brand-600/30'"
                          class="px-4 py-2 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition-all flex items-center space-x-1.5 disabled:opacity-50">
                    <i class="fa-solid fa-play text-[10px]" :class="addingGuid === r.guid ? 'animate-spin' : ''"></i>
                    <span x-text="addingGuid === r.guid ? t('adding_to_library') : t('add_to_library')"></span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: Add by Direct Link / Magnet -->
    <div x-show="activeTab === 'magnet'" class="glass rounded-2xl p-6 shadow-2xl relative space-y-6">
      <div class="border-b border-slate-800 pb-4">
        <h2 class="text-lg font-bold flex items-center space-x-2">
          <i class="fa-solid fa-magnet text-brand-400"></i>
          <span x-text="t('add_link_heading')"></span>
        </h2>
        <p class="text-xs text-slate-400 mt-0.5" x-text="t('add_link_desc')"></p>
      </div>

      <form @submit.prevent="submitTorrent()" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5" x-text="t('magnet_input_label')"></label>
          <div class="relative">
            <input type="text" x-model="form.link" required @input="guessTitle()"
                   placeholder="magnet:?xt=urn:btih:... / http://..."
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-all font-mono">
            <button type="button" @click="pasteClipboard()"
                    class="absolute right-2 top-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg text-slate-300 border border-slate-600 transition-all"
                    x-text="t('paste_btn')">
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5" x-text="t('media_title_label')"></label>
            <input type="text" x-model="form.title"
                   :placeholder="t('media_title_placeholder')"
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-all">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5" x-text="t('poster_label')"></label>
            <input type="text" x-model="form.poster"
                   placeholder="https://image.tmdb.org/..."
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-all">
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
          <div class="flex items-center space-x-4 text-xs text-slate-300">
            <div class="flex items-center space-x-2">
              <span class="text-slate-400 font-medium" x-text="t('search_category_label')"></span>
              <select x-model="form.category"
                      class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer shadow-sm">
                <option value="auto" x-text="t('type_auto')"></option>
                <template x-for="cat in availableCategories" :key="cat.id">
                  <option :value="cat.id" x-text="cat.name || cat.id"></option>
                </template>
              </select>
            </div>

            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" x-model="form.sync_now" class="rounded text-brand-600 focus:ring-brand-500 bg-slate-900 border-slate-700">
              <span class="ml-2 font-medium" x-text="t('sync_immediately')"></span>
            </label>
          </div>

          <button type="submit" :disabled="submitting || !form.link"
                  class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-brand-600/30 hover:shadow-brand-500/40 active:scale-95 transition-all flex items-center space-x-2 disabled:opacity-50">
            <i class="fa-solid fa-plus"></i>
            <span x-text="submitting ? t('adding_to_library') : t('add_to_library')"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- TAB 3: Settings Menu (ADMIN ONLY) -->
    <template x-if="isAdmin">
      <div x-show="activeTab === 'settings'" class="glass rounded-2xl p-6 shadow-2xl relative space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <div>

                  <span x-text="t('create_user_btn')"></span>

            <!-- Users Table -->

              <table class="w-full text-left text-xs">
                <thead class="bg-slate-900 text-slate-400 font-semibold border-b border-slate-800">
                  <tr>
                    <th class="p-3" x-text="t('th_user')"></th>
                    <th class="p-3" x-text="t('th_role')"></th>
                    <th class="p-3" x-text="t('th_created')"></th>
                    <th class="p-3 text-right" x-text="t('th_actions')"></th>

                </thead>
                <tbody class="divide-y divide-slate-800/80 bg-slate-950/40">

                    <tr class="hover:bg-slate-800/30 transition-colors">
                      <td class="p-3 font-semibold text-white flex items-center space-x-2">

                        <span x-text="u.username"></span>
                        <template x-if="u.username === currentUser?.username">
                          <span class="text-[10px] px-1.5 py-0.2 rounded bg-brand-500/20 text-brand-300 font-normal" x-text="t('you_label')"></span>
                        </template>
                      </td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                              :class="u.role === 'admin' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'"

    <!-- Torrents List / Dashboard -->

        </template>
      </div>

      <!-- Torrents Grouped by Category -->
      <div class="space-y-6">
        <template x-for="group in torrentCategorySections" :key="group.id">
          <div class="space-y-3">

              <div class="flex items-center space-x-2.5">

            <!-- Torrents Grid -->

            <div>
              <div class="flex gap-3.5">

                     :title="t('change_poster')">

                         onerror="this.style.display='none'">
                  </template>
                  <template x-if="!t.poster">
                    <div class="flex flex-col items-center justify-center text-slate-600 group-hover/poster:text-slate-400 transition-colors p-1 text-center">

                      <span class="text-[9px] font-medium leading-tight" x-text="t('no_poster')"></span>
                    </div>
                  </template>
                  <!-- Overlay on hover to edit poster -->
                  <div class="absolute inset-0 bg-slate-950/70 opacity-0 group-hover/poster:opacity-100 flex flex-col items-center justify-center transition-opacity text-white text-[10px] space-y-1">
                    <i class="fa-solid fa-image text-cyan-400 text-sm"></i>
                    <span x-text="t('change_poster')"></span>
                  </div>
                </div>

                <!-- Media Details -->
                <div class="flex-1 min-w-0 flex flex-col justify-between">
                  <div class="space-y-1">
                    <div class="flex items-center justify-between gap-1">
                      <div class="flex items-center space-x-1.5 min-w-0">
                        <div class="relative inline-flex items-center group/cat shrink-0" :title="t('change_category')">
                          <select :value="t.category"
                                  @change="changeTorrentCategory(t, $event.target.value)"
                                  class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full cursor-pointer appearance-none pr-4 focus:outline-none transition-all shadow-sm"
                                  :class="getCategoryBadgeClass(t.category)">
                            <template x-for="cat in availableCategories" :key="cat.id">
                              <option :value="cat.id" x-text="cat.name || cat.id" :selected="t.category === cat.id" class="bg-slate-900 text-white font-normal"></option>
                            </template>
                          </select>
                          <i class="fa-solid fa-chevron-down absolute right-1.5 top-1.5 text-[7px] pointer-events-none opacity-60 group-hover/cat:opacity-100 transition-opacity"></i>
                        </div>
                        <span class="text-xs text-slate-400 font-mono truncate" x-text="formatBytes(t.torrent_size)"></span>
                      </div>
                      <div class="flex items-center space-x-1 shrink-0">
                        <button @click.stop="openRenameModal(t)" :title="t('rename_torrent')"
                                class="text-slate-400 hover:text-cyan-300 p-1 rounded-lg hover:bg-slate-800 transition-all shrink-0">
                          <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button @click="deleteTorrent(t.hash, t.clean_title)" :title="t('delete_user_btn')"
                                class="text-slate-500 hover:text-rose-400 p-1 rounded-lg hover:bg-rose-500/10 transition-all shrink-0">
                          <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                      </div>
                    </div>

                    <h3 class="font-bold text-sm text-white line-clamp-1 group-hover:text-brand-300 transition-colors cursor-pointer"
                        @click="openFileManager(t)"
                        :title="t.clean_title" x-text="t.clean_title"></h3>
                    <p class="text-[11px] text-slate-400 line-clamp-1" :title="t.title" x-text="t.title"></p>
                  </div>

                  <!-- Quick Action Buttons -->
                  <div class="flex items-center space-x-2 pt-2">
                    <button @click="openFileManager(t)"
                            class="flex-1 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-brand-600 text-slate-200 hover:text-white border border-slate-700/80 hover:border-brand-500 transition-all text-xs font-semibold flex items-center justify-center space-x-1.5 shadow-sm active:scale-95">
                      <i class="fa-solid fa-folder-tree text-brand-400 group-hover:text-white"></i>
                      <span x-text="t('files_structure')"></span>
                    </button>
                    <button @click="openPosterModal(t)"
                            class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/80 transition-all text-xs font-semibold flex items-center justify-center space-x-1 active:scale-95"
                            :title="t('change_poster')">
                      <i class="fa-solid fa-image text-cyan-400"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Strm Files Info -->
              <div class="mt-3 bg-slate-900/60 rounded-xl p-2.5 text-xs space-y-1 border border-slate-800/60">
                <div class="flex justify-between items-center text-slate-300 font-medium">
                  <span x-text="t('video_files_label')"></span>
                  <span class="text-brand-400 font-bold font-mono" x-text="t.video_files_count"></span>
                </div>
                <div class="text-[11px] text-slate-400 line-clamp-1 font-mono" x-text="t.video_files.map(f => f.name).join(', ')"></div>
              </div>
            </div>

            <!-- Live Status & Peers / Speed footer -->
            <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <!-- When torrent is ACTIVE / STREAMING / PRELOAD -->
              <template x-if="isTorrentActive(t)">
                <div class="flex items-center justify-between w-full">
                  <div class="flex items-center space-x-1.5 min-w-0">
                    <span class="relative flex h-2 w-2 shrink-0">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[11px] font-bold text-emerald-400 shrink-0"
                          x-text="t.stat === 1 ? t('torrent_status_preload') : t('torrent_status_active')"></span>
                    <span class="text-[11px] text-slate-400 font-mono truncate">
                      • <i class="fa-solid fa-arrow-down text-emerald-400 text-[9px]"></i> <span class="text-white font-semibold" x-text="formatSpeed(t.download_speed)"></span>
                      <template x-if="t.upload_speed > 0">
                        <span> • <i class="fa-solid fa-arrow-up text-violet-400 text-[9px]"></i> <span class="text-slate-300" x-text="formatSpeed(t.upload_speed)"></span></span>
                      </template>
                    </span>
                  </div>
                  <div class="flex items-center space-x-2 text-[11px] font-mono shrink-0 pl-2">
                    <span class="text-emerald-400 flex items-center space-x-1" :title="t('seeders_unit')">
                      <i class="fa-solid fa-seedling text-[10px]"></i>
                      <span class="font-bold" x-text="t.connected_seeders || 0"></span>
                    </span>
                    <span class="text-slate-500">/</span>
                    <span class="text-cyan-400 flex items-center space-x-1" :title="t('leechers_unit')">
                      <i class="fa-solid fa-users text-[10px]"></i>
                      <span class="font-bold" x-text="t.active_peers || t.total_peers || 0"></span>
                    </span>
                  </div>
                </div>
              </template>

              <!-- When torrent is IDLE / IN DB -->
              <template x-if="!isTorrentActive(t)">
                <div class="flex items-center justify-between w-full text-slate-400 text-[11px]">
                  <div class="flex items-center space-x-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                    <span class="text-slate-400" x-text="t('torrent_status_in_db')"></span>
                  </div>
                  <div class="flex items-center space-x-2 font-mono text-[10px] text-slate-500">
                    <span class="flex items-center space-x-1" :title="t('seeders_unit')">
                      <i class="fa-solid fa-seedling text-[9px]"></i>
                      <span x-text="t.connected_seeders || 0"></span>
                    </span>
                    <span>/</span>
                    <span class="flex items-center space-x-1" :title="t('leechers_unit')">
                      <i class="fa-solid fa-users text-[9px]"></i>
                      <span x-text="t.total_peers || 0"></span>
                    </span>
                  </div>
                </div>
              </template>
            </div>
          </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Empty state -->
      <div x-show="displayedTorrentsCount === 0" class="text-center py-16 glass rounded-2xl">
        <i class="fa-solid fa-film text-4xl text-slate-600 mb-3"></i>
        <h3 class="text-base font-semibold text-slate-300" x-text="t('no_torrents')"></h3>
        <p class="text-xs text-slate-500 mt-1" x-text="t('no_torrents_desc')"></p>
      </div>
    </div>

  </main>

  <!-- ==================== AUTH MODAL (LOGIN / SETUP) ==================== -->
  <div x-show="authModalOpen"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
    <div class="glass bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl relative overflow-hidden"
         @click.outside="/* cannot close outside */">
      
      <div class="text-center mb-6">
        <img src="/static/logo.png?v=2" alt="Torr2Jelly" class="w-14 h-14 mx-auto rounded-2xl mb-3 shadow-lg shadow-brand-500/20 border border-slate-700">
        <h2 class="text-xl font-bold text-white tracking-tight"
            x-text="authMode === 'setup' ? t('first_run_title') : t('login_title')"></h2>
        <p class="text-xs text-slate-400 mt-1"
           x-text="authMode === 'setup' ? t('first_run_desc') : t('login_desc')"></p>
      </div>

      <template x-if="authError">
        <div class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2">
          <i class="fa-solid fa-circle-exclamation shrink-0 text-rose-400"></i>
          <span x-text="authError"></span>
        </div>
      </template>

      <form @submit.prevent="submitAuth()" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('username_label')"></label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500"></i>
            <input type="text" x-model="authForm.username" required autofocus placeholder="admin"
                   class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('password_label')"></label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500"></i>
            <input type="password" x-model="authForm.password" required minlength="4" placeholder="••••••••"
                   class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <template x-if="authMode === 'setup'">
          <div>
            <label class="block text-slate-300 font-medium mb-1.5" x-text="t('confirm_password_label')"></label>
            <div class="relative">
              <i class="fa-solid fa-shield-check absolute left-3.5 top-3 text-slate-500"></i>
              <input type="password" x-model="authForm.confirmPassword" required minlength="4" placeholder="••••••••"
                     class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
            </div>
          </div>
        </template>

        <button type="submit" :disabled="authLoading"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-brand-600/30 active:scale-95 transition-all flex items-center justify-center space-x-2 disabled:opacity-50">
          <i class="fa-solid" :class="authLoading ? 'fa-spinner animate-spin' : (authMode === 'setup' ? 'fa-user-check' : 'fa-right-to-bracket')"></i>
          <span x-text="authLoading ? t('loading_wait') : (authMode === 'setup' ? t('create_admin_btn') : t('login_btn'))"></span>
        </button>
      </form>
    </div>
  </div>

      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">

          <i class="fa-solid fa-key text-cyan-400"></i>
          <span x-text="t('change_pw_title')"></span>

        <button @click="changePwModalOpen = false" class="text-slate-400 hover:text-white">

  <script>
    function app() {
      return {
        // i18n
        lang: 'en',
        t(key, params = {}) {
          let text = (window.I18N && window.I18N[this.lang] && window.I18N[this.lang][key]) 
                  || (window.I18N && window.I18N['uk'] && window.I18N['uk'][key]) 
                  || key;
          for (const [k, v] of Object.entries(params)) {
            text = text.replace(new RegExp(`\\{${k}\\}`, 'g'), v);
          }
          return text;
        },
        appT(key) {
          return this.t(key);
        },
        setLang(newLang) {
          this.lang = newLang;
          this.settingsForm.language = newLang;
          document.documentElement.lang = newLang;
        },

        // Auth state
        token: localStorage.getItem('torr2jelly_token') || '',
        currentUser: null,
        isLoggedIn: false,
        authModalOpen: false,
        authMode: 'login', // 'login' or 'setup'
        authForm: { username: '', password: '', confirmPassword: '' },
        authError: '',
        authLoading: false,

        // Password change modal
        changePwModalOpen: false,
        changePwForm: { currentPassword: '', newPassword: '', confirmPassword: '' },
        changePwError: '',
        changePwLoading: false,

        // Admin Reset password
        resetPwModalOpen: false,
        resetPwTargetUser: null,
        resetPwForm: { newPassword: '' },

        // File Manager state
        fileManagerModalOpen: false,
        fileManagerLoading: false,
        currentFileManagerTorrent: null,
        fileManagerData: { root_dir: '', folders: [], files: [] },
        selectedFiles: [],
        targetMoveFolder: '',
        organizingSeasons: false,

        // Toast Notifications state
        toasts: [],
        notify(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => {
            this.removeToast(id);
          }, 4500);
        },
        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        },

        // Rename Torrent Modal state
        renameModalOpen: false,
        renameTargetTorrent: null,
        renameForm: { title: '', rename_folder: true, category: 'movie' },
        renamingLoading: false,

        openRenameModal(torrent) {
          if (!torrent) return;
          this.renameTargetTorrent = torrent;
          this.renameForm = {
            title: torrent.clean_title || torrent.title || '',
            rename_folder: true,
            category: torrent.category || 'movie'
          };
          this.renameModalOpen = true;
        },

        async submitRenameTorrent() {
          if (!this.renameTargetTorrent || !this.renameForm.title.trim()) return;
          this.renamingLoading = true;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.renameTargetTorrent.hash + '/rename', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: this.renameForm.title.trim(),
                rename_folder: this.renameForm.rename_folder,
                category: this.renameForm.category
              })
            });
            const data = await res.json();
            if (res.ok) {
              const updatedTitle = data.clean_title || this.renameForm.title.trim();
              this.notify(this.t('torrent_renamed_success', { title: updatedTitle }), 'success');
              this.renameModalOpen = false;
              await this.loadTorrents();
              if (this.currentFileManagerTorrent && this.currentFileManagerTorrent.hash === this.renameTargetTorrent.hash) {
                this.currentFileManagerTorrent.clean_title = updatedTitle;
                this.currentFileManagerTorrent.title = data.title || updatedTitle;
                await this.loadFilesStructure();
              }
            } else {
              this.notify(data.detail || 'Failed to rename', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          } finally {
            this.renamingLoading = false;
          }
        },

        // Poster Modal state
        posterModalOpen: false,
        currentPosterTorrent: null,
        posterInputUrl: '',
        posterLoading: false,

        // User dropdown & users list
        userMenuOpen: false,
        usersList: [],
        newUserForm: { username: '', password: '', role: 'user' },
        addingUser: false,

        // Application state
        activeTab: 'search',
        status: {},
        torrents: [],
        searchResults: [],
        filterStatus: 'all',
        sortBy: 'priority',
        searchQuery: '',
        searchQueryTitle: '',
        selectedTorrentCategory: 'all',
        searchDefaultCategory: 'auto',
        searching: false,
        addingGuid: null,
        syncing: false,
        submitting: false,
        savingSettings: false,
        testingService: null,
        testingAllServices: false,
        serviceTestStatus: {},
        settingsForm: {
          prowlarr_url: '',
          prowlarr_api_key: '',
          jellyfin_url: '',
          jellyfin_api_key: '',
          torrserver_url: '',
          jellyfin_stream_torr_url: '',
          media_dir: '/media',
          categories: [
            { id: 'movie', name: 'Movies', type: 'movie', path: 'movies' },
            { id: 'show', name: 'Shows', type: 'show', path: 'shows' }
          ],
          auto_sync: true,
          sync_interval: 30,
          language: 'en',
          only_gold_torrents: false
        },

        get availableCategories() {
          if (this.settingsForm.categories && this.settingsForm.categories.length > 0) {
            return this.settingsForm.categories;
          }
          if (this.status && this.status.categories && this.status.categories.length > 0) {
            return this.status.categories;
          }
          return [
            { id: 'movie', name: this.t('badge_movie'), type: 'movie', path: 'movies' },
            { id: 'show', name: this.t('badge_show'), type: 'show', path: 'shows' }
          ];
        },

        resolveCategoryPath(catPath) {
          if (!catPath) return this.settingsForm.media_dir || '/media';
          if (catPath.startsWith('/')) return catPath;
          const base = (this.settingsForm.media_dir || '/media').replace(/\/+$/, '');
          return base + '/' + catPath.replace(/^\/+/, '');
        },

        addCategory() {
          if (!this.settingsForm.categories) this.settingsForm.categories = [];
          const num = this.settingsForm.categories.length + 1;
          this.settingsForm.categories.push({
            id: 'category_' + num,
            name: '',
            type: 'movie',
            path: ''
          });
        },

        removeCategory(index) {
          if (!this.settingsForm.categories) return;
          const cat = this.settingsForm.categories[index];
          if (this.settingsForm.categories.length <= 1) {
            this.notify(this.t('cannot_delete_default_cat'), 'error');
            return;
          }
          if (confirm(this.t('delete_category_confirm', { name: cat.name || cat.id }))) {
            this.settingsForm.categories.splice(index, 1);
          }
        },

        getCategoryLabel(catId) {
          if (!catId) return '';
          const cats = this.availableCategories;
          const found = cats.find(c => c.id === catId);
          if (found && found.name) return found.name;
          if (catId === 'movie') return this.t('badge_movie');
          if (catId === 'show') return this.t('badge_show');
          return catId;
        },

        getCategoryBadgeClass(catId) {
          if (catId === 'movie') return 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 hover:border-cyan-400';
          if (catId === 'show') return 'bg-brand-500/20 text-brand-400 border border-brand-500/30 hover:border-brand-400';
          return 'bg-purple-500/20 text-purple-300 border border-purple-500/30 hover:border-purple-300';
        },

        async changeTorrentCategory(torrent, newCat) {
          if (!torrent || !newCat || torrent.category === newCat) return;
          const oldCat = torrent.category;
          torrent.category = newCat;
          try {
            const res = await this.apiFetch('/api/torrents/' + torrent.hash + '/category', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ category: newCat })
            });
            const data = await res.json();
            if (res.ok) {
              this.notify(this.t('category_changed_success', { category: this.getCategoryLabel(newCat) }), 'success');
              await this.loadTorrents();
            } else {
              torrent.category = oldCat;
              this.notify(data.detail || 'Failed to change category', 'error');
            }
          } catch (e) {
            torrent.category = oldCat;
            this.notify('Error: ' + e, 'error');
          }
        },
        form: {
          link: '',
          title: '',
          category: 'auto',
          sync_now: true
        },

          return this.currentUser && this.currentUser.role === 'admin';

        async init() {
          document.documentElement.lang = this.lang;
          await this.checkAuthStatus();
          setInterval(() => {
            if (this.isLoggedIn) {
              this.loadStatus();
            }
          }, 10000);
          setInterval(() => {
            if (this.isLoggedIn) {
              this.loadTorrents();
            }
          }, 15000);
          setInterval(() => {
            if (this.isLoggedIn && this.torrents && this.torrents.some(t => this.isTorrentActive(t))) {
              this.loadTorrents();
            }
          }, 3000);
        },

        // Core API fetch wrapper attaching Bearer token and handling 401
        async apiFetch(url, options = {}) {
          options.headers = options.headers || {};
          if (this.token) {
            options.headers['Authorization'] = `Bearer ${this.token}`;
          }
          try {
            const res = await fetch(url, options);
            if (res.status === 401 && this.isLoggedIn) {
              this.logout(this.t('session_expired'));
              throw new Error('Unauthorized');
            }
            return res;
          } catch (e) {
            throw e;
          }
        },

        async checkAuthStatus() {
          try {
            const res = await fetch('/api/auth/setup-status');
            const data = await res.json();
            if (data.language) {
              this.lang = data.language;
              this.settingsForm.language = data.language;
              document.documentElement.lang = this.lang;
            }
            if (data.setup_required) {
              this.authMode = 'setup';
              this.authModalOpen = true;
              this.isLoggedIn = false;
              return;
            }

            if (this.token) {
              const meRes = await this.apiFetch('/api/auth/me');
              if (meRes.ok) {
                this.currentUser = await meRes.json();
                this.isLoggedIn = true;
                this.authModalOpen = false;
                await this.onLoggedIn();
                return;
              }
            }
          } catch (e) {
            console.error('Error during auth check:', e);
          }

          // Fallback: show login modal
          this.authMode = 'login';
          this.authModalOpen = true;
          this.isLoggedIn = false;
        },

        async submitAuth() {
          this.authError = '';
          this.authLoading = true;
          try {
            if (this.authMode === 'setup') {
              if (this.authForm.password !== this.authForm.confirmPassword) {
                this.authError = this.lang === 'uk' ? 'Паролі не співпадають' : 'Passwords do not match';
                return;
              }
              const res = await fetch('/api/auth/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: this.authForm.username.trim(),
                  password: this.authForm.password
                })
              });
              const data = await res.json();
              if (!res.ok) {
                this.authError = data.detail || (this.lang === 'uk' ? 'Помилка налаштування' : 'Setup error');
                return;
              }
              this.token = data.token;
              localStorage.setItem('torr2jelly_token', this.token);
              this.currentUser = data.user;
              this.isLoggedIn = true;
              this.authModalOpen = false;
              await this.onLoggedIn();
            } else {
              const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: this.authForm.username.trim(),
                  password: this.authForm.password
                })
              });
              const data = await res.json();
              if (!res.ok) {
                this.authError = data.detail || (this.lang === 'uk' ? 'Невірне ім\'я або пароль' : 'Invalid username or password');
                return;
              }
              this.token = data.token;
              localStorage.setItem('torr2jelly_token', this.token);
              this.currentUser = data.user;
              this.isLoggedIn = true;
              this.authModalOpen = false;
              await this.onLoggedIn();
            }
          } catch (e) {
            this.authError = (this.lang === 'uk' ? 'Помилка мережі: ' : 'Network error: ') + e;
          } finally {
            this.authLoading = false;
          }
        },

          await this.loadStatus();
          await this.loadTorrents();
          if (this.isAdmin) {
            await this.loadSettings();
            await this.loadUsersList();

            if (this.activeTab === 'settings') {
              this.activeTab = 'search';

          } else if (serviceName === 'jellyfin') {
            url = this.settingsForm.jellyfin_url;
            apiKey = this.settingsForm.jellyfin_api_key;
          } else if (serviceName === 'torrserver') {

          }

          try {
            const res = await this.apiFetch('/api/settings/test', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ service: serviceName, url: url, api_key: apiKey })
            });
            const data = await res.json();
            if (data.reachable) {
              this.serviceTestStatus[serviceName] = { ok: true, msg: this.t('conn_success') };
            } else {
              this.serviceTestStatus[serviceName] = { ok: false, msg: this.t('conn_failed') };

                  url: this.settingsForm.jellyfin_url,

                })
              }).then(r => r.json()).catch(() => ({ reachable: false })),

              this.apiFetch('/api/settings/test', {

                  service: 'torrserver',

            this.status.jellyfin = { status: jellyRes.reachable ? 'online' : 'offline', url: this.settingsForm.jellyfin_url };

        get filteredTorrents() {
          if (!this.searchQuery) return this.torrents;
          const q = this.searchQuery.toLowerCase();
          return this.torrents.filter(t =>
            t.clean_title.toLowerCase().includes(q) ||
            t.title.toLowerCase().includes(q)
          );
        },

        get displayedTorrentsCount() {
          return this.torrentCategorySections.reduce((sum, s) => sum + s.items.length, 0);
        },

        get activeCategoryPills() {
          const filtered = this.filteredTorrents;
          const cats = this.availableCategories || [];
          
          const counts = {};
          filtered.forEach(t => {
            const cat = t.category || 'movie';
            counts[cat] = (counts[cat] || 0) + 1;
          });

          const pills = [
            { id: 'all', name: this.t('category_filter_all'), count: filtered.length }
          ];

          const knownIds = new Set();
          cats.forEach(c => {
            knownIds.add(c.id);
            pills.push({
              id: c.id,
              name: c.name || c.id,
              count: counts[c.id] || 0
            });
          });

          let otherCount = 0;
          Object.keys(counts).forEach(k => {
            if (!knownIds.has(k)) {
              otherCount += counts[k];
            }
          });

          if (otherCount > 0) {
            pills.push({
              id: 'other',
              name: this.t('category_group_other'),
              count: otherCount
            });
          }

          return pills;
        },

        get torrentCategorySections() {
          const filtered = this.filteredTorrents;
          const cats = this.availableCategories || [];
          const selected = this.selectedTorrentCategory;

          const catMap = new Map();
          cats.forEach(c => catMap.set(c.id, []));
          const otherItems = [];

          filtered.forEach(t => {
            const cat = t.category || 'movie';
            if (catMap.has(cat)) {
              catMap.get(cat).push(t);
            } else {
              otherItems.push(t);
            }
          });

          const sections = [];
          cats.forEach(c => {
            if (selected !== 'all' && selected !== c.id) return;
            const items = catMap.get(c.id) || [];
            if (selected === c.id || items.length > 0) {
              sections.push({
                id: c.id,
                name: c.name || c.id,
                type: c.type || 'movie',
                path: c.path || '',
                items: items
              });
            }
          });

          if (otherItems.length > 0 && (selected === 'all' || selected === 'other')) {
            sections.push({
              id: 'other',
              name: this.t('category_group_other'),
              type: 'movie',
              path: '',
              items: otherItems
            });
          }

          return sections;
        },

        get goldCount() {
          return this.searchResults.filter(r => r.release_status === 'gold').length;
        },

        get filteredSearchResults() {
          let list = [...this.searchResults];
          if (this.filterStatus === 'gold') {
            list = list.filter(r => r.release_status === 'gold');
          }

          // Apply Sorting
          switch (this.sortBy) {
            case 'priority':
              list.sort((a, b) => (b.priority || 0) - (a.priority || 0) || (b.seeders || 0) - (a.seeders || 0));
              break;
            case 'seeders_desc':
              list.sort((a, b) => (b.seeders || 0) - (a.seeders || 0));
              break;
            case 'size_desc':
              list.sort((a, b) => (b.size || 0) - (a.size || 0));
              break;
            case 'size_asc':
              list.sort((a, b) => (a.size || 0) - (b.size || 0));
              break;
            case 'date_desc':
              list.sort((a, b) => new Date(b.publish_date || 0) - new Date(a.publish_date || 0));
              break;
            case 'title_asc':
              list.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
              break;
          }
          return list;
        },

        guessTitle() {
          if (!this.form.link) return;
          const m = this.form.link.match(/dn=([^&]+)/);
          if (m) {
            try {
              let raw = decodeURIComponent(m[1].replace(/\+/g, ' '));
              raw = raw.replace(/\[.*?\]/g, '')
                       .replace(/\(\s*\d{4}.*?\)/g, '')
                       .replace(/\b(1080p|720p|2160p|4K|BDRip|WEB-DL|WEBRip|HEVC|x264|x265)\b/gi, '')
                       .replace(/[._]/g, ' ')
                       .trim();
              this.form.title = raw;
            } catch (e) {}
          }
        },

        async pasteClipboard() {
          try {
            const text = await navigator.clipboard.readText();
            this.form.link = text;
            this.guessTitle();
          } catch (e) {
            this.notify('Clipboard access denied', 'error');
          }
        },

        formatBytes(bytes) {
          if (!bytes || bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },

        formatSpeed(bytes) {
          if (!bytes || bytes <= 0) return '0 KB/s';
          return this.formatBytes(bytes) + (this.lang === 'uk' ? '/с' : '/s');
        },

        isTorrentActive(t) {
          if (!t) return false;
          if (t.download_speed > 0 || t.upload_speed > 0) return true;
          if (t.active_peers > 0) return true;
          if (t.stat === 1 || t.stat === 2 || t.stat === 3) return true;
          if (t.stat_string && t.stat_string.toLowerCase().includes('working')) return true;
          if (t.stat_string && t.stat_string.toLowerCase().includes('preload')) return true;
          return false;
        },

        formatDate(dateStr) {
          if (!dateStr) return '';
          try {
            const d = new Date(dateStr);
            const locale = this.lang === 'uk' ? 'uk-UA' : 'en-US';
            return d.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric' });
          } catch (e) {
            return '';
          }
        },



        // File Structure Manager Methods
        openFileManager(torrent) {
          this.currentFileManagerTorrent = torrent;
          this.selectedFiles = [];
          this.targetMoveFolder = '';
          this.fileManagerModalOpen = true;
          this.loadFilesStructure();
        },

        async loadFilesStructure() {
          if (!this.currentFileManagerTorrent) return;
          this.fileManagerLoading = true;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files');
            if (res.ok) {
              this.fileManagerData = await res.json();
            } else {
              const err = await res.json();
              this.notify(err.detail || 'Failed to load files', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          } finally {
            this.fileManagerLoading = false;
          }
        },

        get fileGroups() {
          if (!this.fileManagerData || !this.fileManagerData.files) return [];
          const groups = {};
          groups[''] = [];
          if (this.fileManagerData.folders) {
            this.fileManagerData.folders.forEach(f => {
              groups[f] = [];
            });
          }
          this.fileManagerData.files.forEach(f => {
            const folder = f.folder || '';
            if (!groups[folder]) groups[folder] = [];
            groups[folder].push(f);
          });
          const result = [];
          if (groups[''].length > 0 || (Object.keys(groups).length === 1 && this.fileManagerData.files.length === 0)) {
            result.push({ folder: '', files: groups[''] });
          }
          Object.keys(groups).sort().forEach(k => {
            if (k !== '') {
              result.push({ folder: k, files: groups[k] });
            }
          });
          return result;
        },

        isGroupSelected(group) {
          if (!group.files.length) return false;
          return group.files.every(f => this.selectedFiles.includes(f.path));
        },

        toggleSelectGroup(group, isChecked) {
          const groupPaths = group.files.map(f => f.path);
          if (isChecked) {
            this.selectedFiles = Array.from(new Set([...this.selectedFiles, ...groupPaths]));
          } else {
            this.selectedFiles = this.selectedFiles.filter(p => !groupPaths.includes(p));
          }
        },

        async autoOrganizeSeasons() {
          if (!this.currentFileManagerTorrent) return;
          this.organizingSeasons = true;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files/organize', {
              method: 'POST'
            });
            const data = await res.json();
            if (res.ok) {
              if (data.organized > 0) {
                this.notify(this.t('auto_organize_done', { count: data.organized }), 'success');
              } else {
                this.notify(this.t('auto_organize_none'), 'info');
              }
              await this.loadFilesStructure();
              await this.loadTorrents();
            } else {
              this.notify(data.detail || 'Failed', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          } finally {
            this.organizingSeasons = false;
          }
        },

        async createFolder() {
          if (!this.currentFileManagerTorrent) return;
          const name = prompt(this.t('folder_name_prompt'), 'Season 01');
          if (!name || !name.trim()) return;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files/folder', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ folder_name: name.trim() })
            });
            if (res.ok) {
              await this.loadFilesStructure();
            } else {
              const err = await res.json();
              this.notify(err.detail || 'Failed', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          }
        },

        async moveSelectedFiles() {
          if (!this.currentFileManagerTorrent || !this.selectedFiles.length) return;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files/move', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                files: this.selectedFiles,
                file_paths: this.selectedFiles,
                target_folder: this.targetMoveFolder
              })
            });
            if (res.ok) {
              this.selectedFiles = [];
              await this.loadFilesStructure();
              await this.loadTorrents();
            } else {
              const err = await res.json();
              this.notify(err.detail || 'Failed to move', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          }
        },

        async renameItem(itemPath, type) {
          if (!this.currentFileManagerTorrent) return;
          const currentName = itemPath.split('/').pop();
          const newName = prompt(this.t('rename_prompt'), currentName);
          if (!newName || !newName.trim() || newName.trim() === currentName) return;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files/rename', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                old_path: itemPath,
                new_path: newName.trim(),
                new_name: newName.trim()
              })
            });
            if (res.ok) {
              await this.loadFilesStructure();
              await this.loadTorrents();
            } else {
              const err = await res.json();
              this.notify(err.detail || 'Failed to rename', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          }
        },

        async deleteItem(itemPath) {
          if (!this.currentFileManagerTorrent) return;
          const name = itemPath.split('/').pop();
          if (!confirm(this.t('confirm_delete_item', { name: name }))) return;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentFileManagerTorrent.hash + '/files?path=' + encodeURIComponent(itemPath) + '&target_path=' + encodeURIComponent(itemPath), {
              method: 'DELETE'
            });
            if (res.ok) {
              this.selectedFiles = this.selectedFiles.filter(p => p !== itemPath && !p.startsWith(itemPath + '/'));
              await this.loadFilesStructure();
              await this.loadTorrents();
            } else {
              const err = await res.json();
              this.notify(err.detail || 'Failed to delete', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          }
        },

        // Poster Modal Methods
        openPosterModal(torrent) {
          this.currentPosterTorrent = torrent;
          this.posterInputUrl = torrent.poster || '';
          this.posterModalOpen = true;
        },

        async autoFindPoster() {
          if (!this.currentPosterTorrent) return;
          this.posterLoading = true;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentPosterTorrent.hash + '/poster', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ auto_fetch: true, auto_find: true })
            });
            const data = await res.json();
            if (res.ok && data.poster) {
              this.posterInputUrl = data.poster;
              this.currentPosterTorrent.poster = data.poster;
              const t = this.torrents.find(x => x.hash === this.currentPosterTorrent.hash);
              if (t) t.poster = data.poster;
              this.notify(this.t('poster_updated_success'), 'success');
            } else {
              this.notify(this.t('poster_not_found'), 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          } finally {
            this.posterLoading = false;
          }
        },

        async saveCustomPoster() {
          if (!this.currentPosterTorrent) return;
          this.posterLoading = true;
          try {
            const res = await this.apiFetch('/api/torrents/' + this.currentPosterTorrent.hash + '/poster', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ poster: this.posterInputUrl.trim() })
            });
            const data = await res.json();
            if (res.ok) {
              this.currentPosterTorrent.poster = data.poster;
              const t = this.torrents.find(x => x.hash === this.currentPosterTorrent.hash);
              if (t) t.poster = data.poster;
              this.notify(this.t('poster_updated_success'), 'success');
              this.posterModalOpen = false;
            } else {
              this.notify(data.detail || 'Failed', 'error');
            }
          } catch (e) {
            this.notify('Error: ' + e, 'error');
          } finally {
            this.posterLoading = false;
          }
        }
      }
    }
  </script>
  <!-- ==================== RENAME TORRENT MODAL ==================== -->
  <div x-show="renameModalOpen"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
    <div class="glass bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl relative"
         @click.outside="renameModalOpen = false">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="font-bold text-sm sm:text-base text-white flex items-center space-x-2">
          <i class="fa-solid fa-pen-to-square text-cyan-400"></i>
          <span x-text="t('rename_torrent_title')"></span>
        </h3>
        <button @click="renameModalOpen = false" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form @submit.prevent="submitRenameTorrent()" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('new_title_label')"></label>
          <input type="text" x-model="renameForm.title" required autofocus
                 class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm font-medium">
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('category_label')"></label>
          <select x-model="renameForm.category"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500 text-xs">
            <template x-for="cat in availableCategories" :key="cat.id">
              <option :value="cat.id" x-text="cat.name || cat.id" :selected="renameForm.category === cat.id"></option>
            </template>
          </select>
        </div>

        <label class="flex items-center space-x-2.5 cursor-pointer text-slate-300">
          <input type="checkbox" x-model="renameForm.rename_folder"
                 class="rounded text-brand-600 focus:ring-brand-500 bg-slate-950 border-slate-700">
          <span x-text="t('rename_folder_label')"></span>
        </label>

        <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-800">
          <button type="button" @click="renameModalOpen = false"
                  class="px-4 py-2 rounded-xl text-slate-400 hover:text-white transition-colors"
                  x-text="t('cancel_btn')"></button>
          <button type="submit" :disabled="renamingLoading || !renameForm.title.trim()"
                  class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-brand-600/30 active:scale-95 transition-all flex items-center space-x-1.5 disabled:opacity-50">
            <i class="fa-solid fa-check" :class="renamingLoading ? 'fa-spinner animate-spin' : ''"></i>
            <span x-text="t('save_btn')"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
