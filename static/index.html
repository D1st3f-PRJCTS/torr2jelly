<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <link rel="icon" type="image/png" href="/static/logo.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/static/logo.png?v=2">
  <link rel="apple-touch-icon" href="/static/logo.png?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torr2Jelly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/static/i18n.js?v=20261018.3"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            jelly: '#00a4dc',
            torr: '#10b981'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=20261018.3">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white"
      x-data="app()" x-init="init()" x-cloak>

  <!-- ==================== TOAST NOTIFICATIONS ==================== -->
  <div class="fixed top-5 right-5 z-50 flex flex-col space-y-2.5 max-w-sm w-full pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto glass rounded-2xl p-4 shadow-2xl border flex items-start space-x-3 transition-all duration-300 animate-in fade-in slide-in-from-top-2"
           :class="{
             'border-emerald-500/40 bg-slate-900/95 text-emerald-300': toast.type === 'success',
             'border-rose-500/40 bg-slate-900/95 text-rose-300': toast.type === 'error',
             'border-cyan-500/40 bg-slate-900/95 text-cyan-300': toast.type === 'info'
           }">
        <div class="shrink-0 mt-0.5">
          <i class="fa-solid text-base"
             :class="{
               'fa-circle-check text-emerald-400': toast.type === 'success',
               'fa-circle-exclamation text-rose-400': toast.type === 'error',
               'fa-circle-info text-cyan-400': toast.type === 'info'
             }"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-white leading-relaxed" x-text="toast.message"></p>
        </div>
        <button @click="removeToast(toast.id)" class="text-slate-400 hover:text-white shrink-0 p-0.5">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </template>
  </div>

  <!-- Top Navbar -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-900/85 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2 sm:gap-4">
      <!-- Logo + Brand -->
      <div class="flex items-center space-x-2.5 sm:space-x-3 cursor-pointer select-none shrink-0" @click="activeTab = 'search'; window.scrollTo({top: 0, behavior: 'smooth'})">
        <img src="/static/logo.png?v=2" alt="Torr2Jelly Logo" class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl object-contain shadow-lg shadow-brand-500/20 border border-slate-700/50">
        <div>
          <div class="flex items-center space-x-1.5 sm:space-x-2">
            <h1 class="text-base sm:text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">Torr2Jelly</h1>
            <span class="text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30 font-medium">v1.5</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block" x-text="t('app_subtitle')"></p>
        </div>
      </div>

      <template x-if="isLoggedIn">
        <div class="flex items-center space-x-1.5 sm:space-x-3">
          <!-- Primary Navigation Tabs (Desktop only) -->
          <nav class="hidden md:flex items-center space-x-1 bg-slate-950/70 p-1 rounded-xl border border-slate-800/80 shadow-inner">
            <button @click="activeTab = 'search'"
                    :class="activeTab === 'search' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                    class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
              <i class="fa-solid fa-magnifying-glass text-[11px]"></i>
              <span x-text="t('tab_search')"></span>
            </button>

            <button @click="activeTab = 'magnet'"
                    :class="activeTab === 'magnet' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                    class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
              <i class="fa-solid fa-magnet text-[11px]"></i>
              <span x-text="t('tab_magnet')"></span>
            </button>

            <template x-if="isAdmin">
              <button @click="activeTab = 'settings'"
                      :class="activeTab === 'settings' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                      class="px-3 py-1.5 rounded-lg text-xs transition-all flex items-center space-x-1.5 active:scale-95">
                <i class="fa-solid fa-gear text-[11px]"></i>
                <span x-text="t('tab_settings')"></span>
              </button>
            </template>
          </nav>

          <!-- Single Smart Sync Button (STRM + Jellyfin refresh) -->
          <button @click="triggerSync()" :disabled="syncing"
                  :title="t('sync_btn_tooltip')"
                  class="flex items-center justify-center w-9 h-9 sm:w-auto sm:px-3.5 sm:py-2 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 active:scale-95 transition-all text-xs font-semibold shadow-md shadow-brand-600/25 disabled:opacity-50 shrink-0">
            <i class="fa-solid fa-rotate text-xs" :class="syncing ? 'animate-spin' : ''"></i>
            <span class="hidden sm:inline sm:ml-2" x-text="syncing ? t('syncing') : t('sync_now')"></span>
          </button>

          <!-- User Menu Dropdown -->
          <div class="relative" @click.outside="userMenuOpen = false">
            <button @click="userMenuOpen = !userMenuOpen"
                    class="flex items-center justify-center space-x-1.5 sm:space-x-2 h-9 px-2.5 sm:px-3 rounded-xl glass hover:bg-slate-800 transition-all text-xs border border-slate-700/80 shrink-0">
              <i class="fa-solid" :class="isAdmin ? 'fa-crown text-amber-400' : 'fa-user text-brand-400'"></i>
              <span class="font-semibold text-white max-w-[85px] truncate hidden sm:inline" x-text="currentUser?.username"></span>
              <span class="text-[10px] px-1.5 py-0.2 rounded font-bold hidden sm:inline"
                    :class="isAdmin ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-400'"
                    x-text="isAdmin ? t('role_admin') : t('role_user')"></span>
              <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''"></i>
            </button>

            <!-- Dropdown Menu (Guaranteed to fit viewport) -->
            <div x-show="userMenuOpen"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 class="absolute right-0 mt-2 w-48 sm:w-52 rounded-xl glass bg-slate-900 border border-slate-700/80 shadow-2xl py-1.5 z-50 text-xs divide-y divide-slate-800 max-w-[calc(100vw-1.5rem)]">
              <div class="px-3 py-2 text-[11px] text-slate-400">
                <span x-text="t('logged_in_as')"></span>: <span class="font-bold text-white truncate inline-block max-w-[120px] align-bottom" x-text="currentUser?.username"></span>
              </div>
              <div class="py-1">
                <template x-if="isAdmin">
                  <button @click="activeTab = 'settings'; userMenuOpen = false"
                          class="w-full text-left px-3 py-2.5 hover:bg-slate-800 active:bg-slate-700 flex items-center space-x-2 text-slate-200">
                    <i class="fa-solid fa-gear text-brand-400 w-4"></i>
                    <span x-text="t('tab_settings')"></span>
                  </button>
                </template>
                <button @click="openChangePasswordModal()"
                        class="w-full text-left px-3 py-2.5 hover:bg-slate-800 active:bg-slate-700 flex items-center space-x-2 text-slate-200">
                  <i class="fa-solid fa-key text-cyan-400 w-4"></i>
                  <span x-text="t('change_password')"></span>
                </button>
              </div>
              <div class="py-1">
                <button @click="logout()"
                        class="w-full text-left px-3 py-2.5 hover:bg-rose-500/10 active:bg-rose-500/20 hover:text-rose-400 flex items-center space-x-2 text-slate-300 transition-colors">
                  <i class="fa-solid fa-arrow-right-from-bracket w-4 text-rose-400"></i>
                  <span x-text="t('logout')"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </header>

  <!-- ==================== MOBILE BOTTOM NAVIGATION BAR ==================== -->
  <nav x-show="isLoggedIn" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/90 px-3 py-1.5 flex items-center justify-around shadow-2xl safe-bottom">
      <!-- Search Tab -->
      <button type="button" @click="activeTab = 'search'; window.scrollTo({top: 0, behavior: 'smooth'})"
              class="flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center transition-all min-h-[44px] active:scale-95"
              :class="activeTab === 'search' ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'">
        <i class="fa-solid fa-magnifying-glass text-base"></i>
        <span class="text-[10px] mt-0.5" x-text="t('tab_search_short') || 'Пошук'"></span>
      </button>

      <!-- Magnet Tab -->
      <button type="button" @click="activeTab = 'magnet'; window.scrollTo({top: 0, behavior: 'smooth'})"
              class="flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center transition-all min-h-[44px] active:scale-95"
              :class="activeTab === 'magnet' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'">
        <i class="fa-solid fa-magnet text-base"></i>
        <span class="text-[10px] mt-0.5" x-text="t('tab_magnet_short') || 'Магнет'"></span>
      </button>

      <!-- Active Torrents Shortcut Tab -->
      <button type="button" @click="scrollToTorrents()"
              class="flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center transition-all min-h-[44px] text-slate-400 hover:text-cyan-400 active:scale-95">
        <div class="relative">
          <i class="fa-solid fa-layer-group text-base text-cyan-400"></i>
          <span class="absolute -top-1 -right-2 px-1 py-0.2 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-mono text-[9px] font-bold" x-text="torrents.length"></span>
        </div>
        <span class="text-[10px] mt-0.5" x-text="t('tab_torrents') || 'Торренти'"></span>
      </button>

      <!-- Settings Tab (Admin only) -->
      <template x-if="isAdmin">
        <button type="button" @click="activeTab = 'settings'; window.scrollTo({top: 0, behavior: 'smooth'})"
                class="flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center transition-all min-h-[44px] active:scale-95"
                :class="activeTab === 'settings' ? 'text-indigo-400 font-bold' : 'text-slate-400 hover:text-slate-200'">
          <i class="fa-solid fa-gear text-base"></i>
          <span class="text-[10px] mt-0.5" x-text="t('tab_settings_short') || 'Налаштування'"></span>
        </button>
      </template>
    </nav>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8 space-y-6 sm:space-y-8 pb-24 md:pb-8" x-show="isLoggedIn">

    <!-- TAB 1: Search Media by Title -->
    <div x-show="activeTab === 'search'" class="space-y-6">
      <div class="glass rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="mb-4">
          <h2 class="text-lg font-bold flex items-center space-x-2">
            <i class="fa-solid fa-magnifying-glass text-amber-400"></i>
            <span x-text="t('search_heading')"></span>
          </h2>
          <p class="text-xs text-slate-400 mt-0.5" x-text="t('search_desc')"></p>
        </div>

        <form @submit.prevent="executeSearch()" class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-4 top-3.5 text-sm text-slate-400"></i>
            <input type="text" x-model="searchQueryTitle" required
                   :placeholder="t('search_placeholder')"
                   class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-10 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all">
            <button type="button" x-show="searchQueryTitle" @click="searchQueryTitle = ''; searchResults = []"
                    class="absolute right-3.5 top-3.5 text-slate-400 hover:text-white transition-colors"
                    title="Очистити">
              <i class="fa-solid fa-circle-xmark text-sm"></i>
            </button>
          </div>
          <button type="submit" :disabled="searching || !searchQueryTitle.trim()"
                  class="px-7 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-semibold text-sm shadow-lg shadow-orange-500/25 active:scale-95 transition-all flex items-center justify-center space-x-2 disabled:opacity-50">
            <i class="fa-solid fa-magnifying-glass" :class="searching ? 'animate-spin' : ''"></i>
            <span x-text="searching ? t('searching_btn') : t('search_btn')"></span>
          </button>
        </form>

        <!-- Filters & Sorting bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mt-4 pt-3 border-t border-slate-800 text-xs">
          <!-- Status Filter -->
          <div class="flex items-center space-x-3 text-slate-400">
            <template x-if="status.only_gold_torrents && !isAdmin">
              <span class="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold text-[11px] flex items-center space-x-1.5">
                <i class="fa-solid fa-crown text-amber-400 text-[10px]"></i>
                <span x-text="t('gold_only_mode_active')"></span>
              </span>
            </template>
            <template x-if="!status.only_gold_torrents || isAdmin">
              <div class="flex items-center space-x-2">
                <span class="font-medium text-slate-400 text-[11px]" x-text="t('filter_label')"></span>
                <button type="button" @click="filterStatus = 'all'"
                        class="px-2.5 py-1 rounded-lg border text-xs transition-all"
                        :class="filterStatus === 'all' ? 'bg-slate-800 border-slate-600 text-white font-bold' : 'border-slate-800 hover:bg-slate-800/60 text-slate-400'"
                        x-text="t('filter_all')">
                </button>
                <button type="button" @click="filterStatus = 'gold'"
                        class="px-2.5 py-1 rounded-lg border text-xs transition-all flex items-center space-x-1.5"
                        :class="filterStatus === 'gold' ? 'bg-amber-500/20 border-amber-500/40 text-amber-300 font-bold' : 'border-slate-800 hover:bg-slate-800/60 text-amber-400/80'">
                  <span x-text="t('filter_gold')"></span>
                  <span class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-400 text-[10px] font-bold" x-text="goldCount"></span>
                </button>
              </div>
            </template>
          </div>

          <!-- Dropdowns in responsive grid -->
          <div class="grid grid-cols-2 sm:flex sm:items-center gap-2 w-full sm:w-auto">
            <!-- Category Default Dropdown -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:space-x-1.5">
              <span class="text-slate-400 font-medium text-[11px] hidden sm:inline" x-text="t('search_category_label')"></span>
              <select x-model="searchDefaultCategory"
                      class="w-full sm:w-auto bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer shadow-sm">
                <option value="auto" x-text="t('type_auto')"></option>
                <template x-for="cat in availableCategories" :key="cat.id">
                  <option :value="cat.id" x-text="cat.name || cat.id"></option>
                </template>
              </select>
            </div>

            <!-- Sorting Dropdown -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:space-x-1.5">
              <span class="text-slate-400 font-medium text-[11px] hidden sm:inline" x-text="t('sort_label')"></span>
              <select x-model="sortBy"
                      class="w-full sm:w-auto bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer shadow-sm">
                <option value="priority" x-text="t('sort_priority')"></option>
                <option value="seeders_desc" x-text="t('sort_seeders_desc')"></option>
                <option value="size_desc" x-text="t('sort_size_desc')"></option>
                <option value="size_asc" x-text="t('sort_size_asc')"></option>
                <option value="date_desc" x-text="t('sort_date_desc')"></option>
                <option value="title_asc" x-text="t('sort_title_asc')"></option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Search Results -->
      <div x-show="searchResults.length > 0" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-300">
            <span x-text="t('results_shown')"></span> <span class="text-amber-400" x-text="filteredSearchResults.length"></span>
          </h3>
          <span class="text-xs text-slate-500" x-text="t('click_hint')"></span>
        </div>

        <div class="glass rounded-xl overflow-hidden border border-slate-800">
          <div class="divide-y divide-slate-800/80">
            <template x-for="r in filteredSearchResults" :key="r.guid || r.link">
              <div class="p-4 hover:bg-slate-800/40 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                   :class="r.release_status === 'gold' ? 'bg-amber-500/[0.03]' : ''">
                <div class="flex-1 min-w-0 space-y-1.5">
                  <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <!-- Gold / Silver Status Badges -->
                    <template x-if="r.release_status === 'gold'">
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-500/20 to-yellow-500/20 text-amber-300 border border-amber-500/40 font-bold flex items-center space-x-1 shadow-sm shadow-amber-500/20">
                        <span x-text="t('badge_gold')"></span>
                      </span>
                    </template>
                    <template x-if="r.release_status === 'silver'">
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-400/20 text-slate-300 border border-slate-400/40 font-bold flex items-center space-x-1">
                        <span x-text="t('badge_silver')"></span>
                      </span>
                    </template>

                    <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold" x-text="r.indexer"></span>
                    <span class="text-xs text-slate-400 font-medium" x-text="formatBytes(r.size)"></span>
                    <span class="text-xs text-emerald-400 font-semibold flex items-center space-x-1">
                      <i class="fa-solid fa-arrow-up text-[10px]"></i>
                      <span x-text="r.seeders + ' ' + t('seeders_unit')"></span>
                    </span>
                    <span class="text-xs text-slate-500 flex items-center space-x-1">
                      <i class="fa-solid fa-arrow-down text-[10px]"></i>
                      <span x-text="r.leechers + ' ' + t('leechers_unit')"></span>
                    </span>
                    <template x-if="r.publish_date">
                      <span class="text-[11px] text-slate-500" x-text="formatDate(r.publish_date)"></span>
                    </template>
                  </div>

                  <!-- Clickable Torrent Link -->
                  <div>
                    <a :href="r.page_url" target="_blank" rel="noopener noreferrer"
                       class="text-sm font-bold text-white hover:text-amber-400 transition-colors inline-flex items-center space-x-1.5 group/link"
                       :title="r.title">
                      <span class="line-clamp-1" x-text="r.title"></span>
                      <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400 group-hover/link:text-amber-400 transition-colors shrink-0"></i>
                    </a>
                  </div>

                  <p class="text-xs text-slate-400">
                    <span x-text="t('jellyfin_name')"></span> <span class="text-slate-200 font-semibold" x-text="r.clean_title"></span>
                  </p>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center gap-2 mt-2 sm:mt-0 shrink-0 w-full sm:w-auto">
                  <select x-model="r.category"
                          :title="t('category_label')"
                          class="w-full sm:w-auto bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500 cursor-pointer shadow-sm min-h-[38px]">
                    <option value="auto" x-text="t('type_auto')"></option>
                    <template x-for="cat in availableCategories" :key="cat.id">
                      <option :value="cat.id" x-text="cat.name || cat.id" :selected="r.category === cat.id"></option>
                    </template>
                  </select>
                  <button @click="addFromSearch(r)" :disabled="addingGuid === r.guid"
                          :class="r.release_status === 'gold' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-bold shadow-amber-500/25' : 'bg-brand-600 hover:bg-brand-500 text-white shadow-brand-600/30'"
                          class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition-all flex items-center justify-center space-x-1.5 disabled:opacity-50 min-h-[38px]">
                    <i class="fa-solid fa-play text-[10px]" :class="addingGuid === r.guid ? 'animate-spin' : ''"></i>
                    <span x-text="addingGuid === r.guid ? t('adding_to_library') : t('add_to_library')"></span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: Add by Direct Link / Magnet -->

                      <div class="flex items-center space-x-1 shrink-0">
                        <button type="button" @click="renameItem(file.path, 'file')" :title="t('rename_item')"
                                class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-cyan-300 transition-colors">
                          <i class="fa-solid fa-pencil text-xs"></i>
                        </button>
                        <button type="button" @click="deleteItem(file.path)" :title="t('delete_item')"
                                class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/60 hover:bg-rose-500/10 text-slate-500 hover:text-rose-400 transition-colors">
                          <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ==================== POSTER MODAL ==================== -->
  <div x-show="posterModalOpen"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="glass bg-slate-900 border border-slate-700/80 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative"
         @click.outside="posterModalOpen = false">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="font-bold text-sm text-white flex items-center space-x-2">
          <i class="fa-solid fa-image text-cyan-400"></i>
          <span x-text="t('poster_modal_title')"></span>
        </h3>
        <button type="button" @click="posterModalOpen = false" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="space-y-4 text-xs">
        <!-- Preview Box -->
        <div class="flex flex-col items-center">
          <div class="w-36 h-52 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden shadow-lg flex items-center justify-center relative">
            <template x-if="posterInputUrl || currentPosterTorrent?.poster">
              <img :src="posterInputUrl || currentPosterTorrent?.poster"
                   class="w-full h-full object-cover"
                   onerror="this.src='data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='150' fill='%23475569'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'>Invalid URL</text></svg>'">
            </template>
            <template x-if="!posterInputUrl && !currentPosterTorrent?.poster">
              <div class="text-center text-slate-600 p-2">
                <i class="fa-solid fa-film text-3xl mb-2"></i>
                <p x-text="t('no_poster')"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- Auto Search Button -->
        <button type="button" @click="autoFindPoster()" :disabled="posterLoading"
                class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold shadow-md shadow-cyan-600/20 active:scale-95 transition-all flex items-center justify-center space-x-2 disabled:opacity-50">
          <i class="fa-solid fa-wand-magic-sparkles" :class="posterLoading ? 'animate-spin' : ''"></i>
          <span x-text="posterLoading ? t('finding_poster') : t('auto_find_poster')"></span>
        </button>

        <!-- Custom URL Input Form -->
        <div class="pt-2 border-t border-slate-800 space-y-2">
          <label class="block text-slate-300 font-medium" x-text="t('custom_poster_url')"></label>
          <input type="text" x-model="posterInputUrl"
                 placeholder="https://..."
                 class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 text-xs">
          
          <div class="flex items-center justify-end space-x-2 pt-2">
            <button type="button" @click="posterModalOpen = false" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white"
                    x-text="t('cancel_btn')"></button>
            <button type="button" @click="saveCustomPoster()" :disabled="posterLoading"
                    class="px-4 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold shadow-md active:scale-95 transition-all"
                    x-text="t('save_poster_btn')"></button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- ==================== RENAME TORRENT MODAL ==================== -->
  <div x-show="renameModalOpen"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
    <div class="glass bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl relative"
         @click.outside="renameModalOpen = false">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="font-bold text-sm sm:text-base text-white flex items-center space-x-2">
          <i class="fa-solid fa-pen-to-square text-cyan-400"></i>
          <span x-text="t('rename_torrent_title')"></span>
        </h3>
        <button type="button" @click="renameModalOpen = false" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <form @submit.prevent="submitRenameTorrent()" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('new_title_label')"></label>
          <input type="text" x-model="renameForm.title" required autofocus
                 class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm font-medium">
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1.5" x-text="t('category_label')"></label>
          <select x-model="renameForm.category"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500 text-xs">
            <template x-for="cat in availableCategories" :key="cat.id">
              <option :value="cat.id" x-text="cat.name || cat.id" :selected="renameForm.category === cat.id"></option>
            </template>
          </select>
        </div>

        <label class="flex items-center space-x-2.5 cursor-pointer text-slate-300">
          <input type="checkbox" x-model="renameForm.rename_folder"
                 class="rounded text-brand-600 focus:ring-brand-500 bg-slate-950 border-slate-700">
          <span x-text="t('rename_folder_label')"></span>
        </label>

        <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-800">
          <button type="button" @click="renameModalOpen = false"
                  class="px-4 py-2 rounded-xl text-slate-400 hover:text-white transition-colors"
                  x-text="t('cancel_btn')"></button>
          <button type="submit" :disabled="renamingLoading || !renameForm.title.trim()"
                  class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-brand-600/30 active:scale-95 transition-all flex items-center space-x-1.5 disabled:opacity-50">
            <i class="fa-solid fa-check" :class="renamingLoading ? 'fa-spinner animate-spin' : ''"></i>
            <span x-text="t('save_btn')"></span>
          </button>
        </div>
      </form>
    </div>
  </div>


    <!-- ==================== DELETE TORRENT CONFIRMATION MODAL ==================== -->
  <div x-show="deleteTorrentModalOpen"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       style="display: none;">
    <div class="glass bg-slate-900 border border-rose-500/30 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl relative space-y-4 max-h-[92vh] overflow-y-auto modal-scroll"
         @click.outside="if (!deletingTorrent) deleteTorrentModalOpen = false"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100">
      
      <div class="flex items-start space-x-3.5 border-b border-slate-800 pb-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-lg shrink-0 border border-rose-500/30">
          <i class="fa-solid fa-trash-can"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-sm sm:text-base text-white" x-text="t('delete_torrent_modal_title')"></h3>
          <p class="text-xs text-slate-400 mt-0.5" x-text="t('delete_torrent_modal_desc')"></p>
        </div>
        <button type="button" @click="deleteTorrentModalOpen = false" :disabled="deletingTorrent"
                class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-all shrink-0">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <template x-if="torrentToDelete">
        <div class="bg-slate-950/80 rounded-xl p-3.5 border border-slate-800 space-y-2">
          <div class="flex items-center space-x-2">
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full"
                  :class="getCategoryBadgeClass(torrentToDelete.category)"
                  x-text="torrentToDelete.category"></span>
            <span class="text-xs text-slate-400 font-mono" x-text="formatBytes(torrentToDelete.torrent_size)"></span>
          </div>
          <p class="font-semibold text-xs sm:text-sm text-white line-clamp-2" x-text="torrentToDelete.clean_title || torrentToDelete.title"></p>
        </div>
      </template>

      <label class="flex items-start space-x-3 cursor-pointer p-3 rounded-xl bg-slate-950/50 border border-slate-800 hover:border-slate-700 transition-colors">
        <input type="checkbox" x-model="deleteTorrentStrm"
               class="mt-0.5 rounded text-rose-500 focus:ring-rose-500 bg-slate-950 border-slate-700 w-4 h-4">
        <div>
          <span class="font-medium text-xs text-white" x-text="t('delete_torrent_strm_checkbox')"></span>
          <p class="text-[11px] text-slate-400 mt-0.5" x-text="t('delete_torrent_warning')"></p>
        </div>
      </label>

      <div class="flex items-center space-x-3 pt-2 border-t border-slate-800">
        <button type="button" @click="deleteTorrentModalOpen = false" :disabled="deletingTorrent"
                class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-semibold border border-slate-700 transition-all min-h-[42px]"
                x-text="t('cancel_btn')">
        </button>
        <button type="button" @click="confirmDeleteTorrent()" :disabled="deletingTorrent"
                class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white text-xs font-bold shadow-lg shadow-rose-600/30 transition-all flex items-center justify-center space-x-2 disabled:opacity-50 min-h-[42px]">
          <i class="fa-solid fa-trash-can" :class="deletingTorrent ? 'animate-spin' : ''"></i>
          <span x-text="deletingTorrent ? t('delete_torrent_deleting') : t('delete_torrent_confirm_btn')"></span>
        </button>
      </div>
    </div>
  </div>


  <!-- Application Core Script -->
  <script src="/static/js/app.js?v=20261018.3"></script>
</body>
</html>
